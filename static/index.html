<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperSage_v2.1 - Paper Summarization and Guided Exploration</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/12.3.2/markdown-it.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        #chat-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            height: 100vh;
            background-color: #1e1e1e;
        }

        header {
            background: linear-gradient(45deg, #6200ea, #3700b3);
            text-align: center;
            padding: 20px;
            color: #ffffff;
            font-size: 1.75rem;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #1e1e1e;
        }

        .agent-message.result table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            font-size: 0.9em;
        }
        .agent-message.result th,
        .agent-message.result td {
            border: 1px solid #555;
            padding: 8px;
            text-align: left;
            word-break: break-word;
        }
        .agent-message.result th {
            background-color: #2e2e2e;
            font-weight: bold;
        }
        .agent-message.result tr:nth-child(even) {
            background-color: #2a2a2a;
        }
        .agent-message.result a {
            color: #bb86fc;
        }

        .agent-message {
            padding: 15px;
            border-radius: 12px;
            word-wrap: break-word;
            max-width: 100%;
            animation: fadeIn 0.3s ease-in-out;
        }

        .agent-message.system {
            background-color: #2e2e2e;
            color: #e0e0e0;
            max-width: 80%;
        }

        .agent-message.result {
            background-color: #3a3f5a;
            color: #ffffff;
            align-self: flex-start;
            max-width: 95%;
            word-break: break-all;
            overflow-wrap: break-word;
            white-space: normal;
            display: block;
            padding: 15px;
        }
        .agent-message.result * {
            max-width: 100%;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .agent-message.result ol,
        .agent-message.result ul {
            padding-left: 25px;
            margin-left: 5px;
        }
        .agent-message.result li {
            margin-bottom: 4px;
        }

        .agent-message.user {
            background: linear-gradient(45deg, #4caf50, #388e3c);
            color: #ffffff;
            align-self: flex-end;
            max-width: 80%;
        }

        .status-loading {
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        #toolbar {
            display: flex;
            padding: 10px 20px;
            gap: 10px;
            background: #2a2a2a;
            border-bottom: 1px solid #555;
            align-items: center;
        }
        #toolbar button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        #toolbar button:hover {
            opacity: 0.8;
        }
        #upload-btn {
            background: #6200ea;
            color: #fff;
        }
        #parse-url-btn {
            background: #03dac6;
            color: #000;
        }
        #url-input {
            flex: 1;
            padding: 8px 12px;
            background: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 14px;
        }
        #url-input:focus {
            outline: 2px solid #6200ea;
        }

        #input-container {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background-color: #1e1e1e;
            border-top: 1px solid #555;
        }

        #message-input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background-color: #2e2e2e;
            color: #e0e0e0;
        }

        #message-input:focus {
            outline: 2px solid #6200ea;
        }

        #send-button {
            margin-left: 10px;
            padding: 15px;
            background: linear-gradient(45deg, #6200ea, #3700b3);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #send-button:hover {
            background-color: #3700b3;
        }

        #send-button:disabled {
            background-color: #424242;
            cursor: not-allowed;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <header>PAPERSAGE_v2.1</header>
        <!-- 工具栏 -->
        <div id="toolbar">
            <input type="file" id="file-input" accept=".pdf,.txt" style="display: none;">
            <button id="upload-btn">📤 上传文件</button>
            <input type="text" id="url-input" placeholder="输入网页 URL..." autocomplete="off">
            <button id="parse-url-btn">🌐 解析 URL</button>
        </div>
        <div id="messages" role="log" aria-live="polite"></div>
        <div id="input-container">
            <input type="text" id="message-input" placeholder="Enter your query..." autocomplete="off" aria-label="Message input field">
            <button id="send-button" disabled aria-label="Send message">Send</button>
        </div>
    </div>

    <script>
        // markdown-it 配置
        const md = window.markdownit({
            breaks: true,
            linkify: true,
            html: true,
            typographer: true
        });

        const wsUrl = window.location.origin.replace(/^http/, 'ws') + '/ws';
        const ws = new WebSocket(wsUrl);
        const messagesContainer = document.getElementById('messages');
        const input = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const fileInput = document.getElementById('file-input');
        const urlInput = document.getElementById('url-input');

        let loadingDiv = null;
        let currentChatDiv = null;
        let currentChatResponseDiv = null;

        // ---------- WebSocket 事件 ----------
        ws.onopen = () => console.log('Connected to WebSocket');

        ws.onmessage = (event) => {
            if (loadingDiv) {
                loadingDiv.remove();
                loadingDiv = null;
            }

            const response = JSON.parse(event.data);
            if (response.type === 'error') {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'agent-message system';
                errorDiv.style.color = 'red';
                errorDiv.textContent = `❌ Error: ${response.message}`;
                messagesContainer.appendChild(errorDiv);
                currentChatDiv = null;
                currentChatResponseDiv = null;
                return;
            }

            if (response.type === 'update') {
                const agent = response.agent;
                let content = response.content || '';

                if (agent === 'user') return;

                if (agent === 'FormatterAgent') {
                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'agent-message result';
                    content = content.replace(/\s*\*\*TERMINATE\*\*\s*$/, '').replace(/\s*TERMINATE\s*$/, '');
                    resultDiv.innerHTML = md.render(content);
                    messagesContainer.appendChild(resultDiv);
                    currentChatDiv = null;
                    currentChatResponseDiv = null;
                } else if (agent === 'ChatAgent') {
                    if (!currentChatDiv) {
                        currentChatDiv = document.createElement('div');
                        currentChatDiv.className = 'agent-message system';
                        currentChatDiv.textContent = '🤖 正在思考...';
                        messagesContainer.appendChild(currentChatDiv);
                        currentChatResponseDiv = document.createElement('div');
                        currentChatResponseDiv.className = 'agent-message system';
                        currentChatResponseDiv.textContent = '';
                        messagesContainer.appendChild(currentChatResponseDiv);
                    }
                    if (content === '🤖 正在思考...\n\n') return;
                    currentChatResponseDiv.textContent += content;
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    return;
                } else if (agent === 'SearchAgent') {
                    if (content.includes('Successfully retrieved')) {
                        const match = content.match(/retrieved (\d+) articles/);
                        if (match) {
                            const msgDiv = document.createElement('div');
                            msgDiv.className = 'agent-message system';
                            msgDiv.textContent = `🔍 已检索到 ${match[1]} 篇文献`;
                            messagesContainer.appendChild(msgDiv);
                        }
                    }
                    currentChatDiv = null;
                    currentChatResponseDiv = null;
                } else if (agent === 'QueryPlanner') {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'agent-message system status-loading';
                    msgDiv.textContent = '📋 正在优化搜索策略...';
                    messagesContainer.appendChild(msgDiv);
                    currentChatDiv = null;
                    currentChatResponseDiv = null;
                } else if (agent === 'SynthesisAgent') {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'agent-message system status-loading';
                    msgDiv.textContent = '✍️ 正在撰写综述...';
                    messagesContainer.appendChild(msgDiv);
                    currentChatDiv = null;
                    currentChatResponseDiv = null;
                } else if (agent === 'Thinking' || agent === 'System' || agent === 'FastSummary') {
                    if (agent === 'FastSummary' || agent === 'System') {
                        const resultDiv = document.createElement('div');
                        resultDiv.className = agent === 'System' ? 'agent-message system' : 'agent-message result';
                        if (agent === 'System') {
                            resultDiv.textContent = content;
                        } else {
                            resultDiv.innerHTML = md.render(content);
                        }
                        messagesContainer.appendChild(resultDiv);
                    } else {
                        const msgDiv = document.createElement('div');
                        msgDiv.className = 'agent-message system status-loading';
                        msgDiv.textContent = content || '🤔 正在思考...';
                        messagesContainer.appendChild(msgDiv);
                    }
                    currentChatDiv = null;
                    currentChatResponseDiv = null;
                } else {
                    const msgDiv = document.createElement('div');
                    const isMarkdown = content.trim().startsWith('#') || 
                                       content.includes('##') || 
                                       content.includes('**') ||
                                       content.includes('- ') ||
                                       content.includes('* ') ||
                                       content.includes('###');
                    if (isMarkdown) {
                        msgDiv.className = 'agent-message result';
                        content = content.replace(/\s*\*\*TERMINATE\*\*\s*$/, '').replace(/\s*TERMINATE\s*$/, '');
                        msgDiv.innerHTML = md.render(content);
                    } else {
                        msgDiv.className = 'agent-message system';
                        if (content.length > 100) {
                            content = content.substring(0, 100) + '...';
                        }
                        msgDiv.textContent = content;
                    }
                    messagesContainer.appendChild(msgDiv);
                    currentChatDiv = null;
                    currentChatResponseDiv = null;
                }
            } else if (response.type === 'end') {
                if (currentChatResponseDiv) {
                    const rawText = currentChatResponseDiv.textContent;
                    currentChatResponseDiv.innerHTML = md.render(rawText);
                    currentChatResponseDiv.className = 'agent-message result';
                }
                currentChatDiv = null;
                currentChatResponseDiv = null;
            }

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        };

        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
            if (loadingDiv) {
                loadingDiv.remove();
                loadingDiv = null;
            }
            const errorDiv = document.createElement('div');
            errorDiv.className = 'agent-message system';
            errorDiv.style.color = 'red';
            errorDiv.textContent = '❌ Connection lost. Please try again later.';
            messagesContainer.appendChild(errorDiv);
        };

        ws.onclose = () => {
            if (loadingDiv) {
                loadingDiv.remove();
                loadingDiv = null;
            }
            const closeDiv = document.createElement('div');
            closeDiv.className = 'agent-message system';
            closeDiv.style.color = 'orange';
            closeDiv.textContent = '⏳ Connection closed. Reconnecting...';
            messagesContainer.appendChild(closeDiv);
            setTimeout(() => location.reload(), 5000);
        };

        function sendMessage() {
            const message = input.value.trim();
            if (message) {
                const userDiv = document.createElement('div');
                userDiv.className = 'agent-message user';
                userDiv.textContent = `You: ${message}`;
                messagesContainer.appendChild(userDiv);

                loadingDiv = document.createElement('div');
                loadingDiv.className = 'agent-message system';
                loadingDiv.textContent = '⏳ 正在处理，请稍候...';
                messagesContainer.appendChild(loadingDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                ws.send(JSON.stringify({ type: 'user_message', content: message }));
                input.value = '';
                sendButton.disabled = true;
            }
        }

        // ----- 文件上传和 URL 解析事件 -----
        document.getElementById('upload-btn').addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                if (!response.ok) {
                    const err = await response.text();
                    alert(`上传失败: ${err}`);
                    return;
                }
                const data = await response.json();
                const msg = `解析文件: ${data.file_id}`;
                input.value = msg;
                sendMessage();
            } catch (err) {
                alert(`上传异常: ${err.message}`);
            }
            fileInput.value = '';
        });

        document.getElementById('parse-url-btn').addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (!url) {
                alert('请输入有效的 URL');
                return;
            }
            const msg = `解析URL: ${url}`;
            input.value = msg;
            sendMessage();
            urlInput.value = '';
        });

        // 输入框事件
        input.addEventListener('input', () => {
            sendButton.disabled = input.value.trim() === '';
        });
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        sendButton.addEventListener('click', sendMessage);
        sendButton.disabled = true;
    </script>
</body>
</html>
